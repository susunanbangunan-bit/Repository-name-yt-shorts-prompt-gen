<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Shorts Prompt Gen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>
<body class="min-h-screen bg-gray-950 p-4 md:p-8 font-sans text-gray-200">

    <div class="max-w-6xl mx-auto space-y-6">
        <!-- Header -->
        <header class="text-center space-y-2 mb-8">
            <div class="inline-flex items-center justify-center p-3 bg-gray-900 rounded-2xl border border-gray-800 shadow-xl mb-2">
                <svg class="w-8 h-8 text-violet-500 mr-2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><path d="m9 8 6 4-6 4Z"/></svg>
                <h1 class="text-3xl font-extrabold text-white tracking-tight">
                    YT Shorts <span class="text-transparent bg-clip-text bg-gradient-to-r from-violet-500 to-fuchsia-500">Prompt Gen</span>
                </h1>
            </div>
            <p class="text-gray-400 font-medium text-sm">Direct English Prompts untuk Midjourney / Runway / Sora (Vertical 9:16)</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- Left Column: Input Panel -->
            <div class="lg:col-span-4 space-y-6">
                <div class="bg-gray-900 rounded-3xl p-6 border border-gray-800 shadow-lg">
                    
                    <!-- Tabs -->
                    <div class="flex bg-gray-950 p-1 rounded-xl mb-6 border border-gray-800">
                        <button id="tab-text" onclick="switchTab('text')" class="flex-1 flex items-center justify-center py-2.5 px-4 rounded-lg font-semibold text-xs uppercase tracking-wider transition-all bg-gray-800 text-violet-400 shadow-sm">
                            <svg class="w-4 h-4 mr-2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                            Text Idea
                        </button>
                        <button id="tab-image" onclick="switchTab('image')" class="flex-1 flex items-center justify-center py-2.5 px-4 rounded-lg font-semibold text-xs uppercase tracking-wider transition-all text-gray-500 hover:text-gray-400">
                            <svg class="w-4 h-4 mr-2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
                            Image Ref
                        </button>
                    </div>

                    <!-- Input Areas -->
                    <div id="input-text-container" class="space-y-3 block">
                        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider">Concept / Story Idea</label>
                        <textarea id="textInput" rows="5" placeholder="e.g., Kucing orange gemuk yang mencoba menangkap kupu-kupu tapi selalu gagal, lucu..." class="w-full bg-gray-950 border border-gray-800 text-gray-200 rounded-xl p-4 focus:ring-1 focus:ring-violet-500 focus:border-violet-500 outline-none transition-all resize-none text-sm placeholder-gray-600"></textarea>
                    </div>

                    <div id="input-image-container" class="space-y-3 hidden">
                        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider">Upload Reference Image</label>
                        <div class="border-2 border-dashed border-gray-800 bg-gray-950 rounded-2xl p-6 text-center hover:border-violet-500/50 transition-colors cursor-pointer relative overflow-hidden">
                            <input type="file" id="fileInput" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20" onchange="handleImageChange(event)">
                            
                            <div id="image-preview-container" class="hidden space-y-4 relative z-10">
                                <img id="imagePreview" src="" alt="Preview" class="mx-auto h-32 object-contain rounded-lg shadow-sm">
                                <button onclick="clearImage(event)" class="inline-flex items-center text-xs text-red-400 hover:text-red-300 font-medium bg-gray-900 px-3 py-1.5 rounded-full border border-gray-800 relative z-30">
                                    <svg class="w-3.5 h-3.5 mr-1.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                                    Remove Image
                                </button>
                            </div>

                            <div id="image-placeholder" class="space-y-2 pointer-events-none py-4">
                                <div class="bg-gray-900 w-12 h-12 rounded-full flex items-center justify-center mx-auto text-gray-500 border border-gray-800">
                                    <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
                                </div>
                                <p class="text-sm font-medium text-gray-400">Click or drag image here</p>
                            </div>
                        </div>
                    </div>

                    <!-- Settings -->
                    <div class="mt-6 space-y-4 pt-6 border-t border-gray-800">
                        <div class="flex items-center text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">
                            <svg class="w-4 h-4 mr-2 text-violet-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                            Style Options
                        </div>
                        
                        <div class="space-y-1.5">
                            <label class="text-[11px] font-medium text-gray-500">Duration / Sequence</label>
                            <select id="selDuration" class="w-full bg-gray-950 border border-gray-800 text-gray-300 text-sm rounded-lg p-2.5 outline-none focus:ring-1 focus:ring-violet-500">
                                <option value="15 Detik (3 Shot)">15 Detik (3 Shot)</option>
                                <option value="30 Detik (5 Shot)">30 Detik (5 Shot)</option>
                                <option value="60 Detik (8 Shot)">60 Detik (8 Shot)</option>
                            </select>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div class="space-y-1.5">
                                <label class="text-[11px] font-medium text-gray-500">Art Style</label>
                                <select id="selStyle" class="w-full bg-gray-950 border border-gray-800 text-gray-300 text-sm rounded-lg p-2.5 outline-none focus:ring-1 focus:ring-violet-500">
                                    <option value="3D Pixar/Disney">3D Pixar/Disney</option>
                                    <option value="2D Kartun Flat">2D Kartun Flat</option>
                                    <option value="Claymation">Claymation</option>
                                    <option value="Anime Anak">Anime Anak</option>
                                    <option value="Cat Air Lembut">Cat Air Lembut</option>
                                    <option value="Stop Motion">Stop Motion</option>
                                </select>
                            </div>

                            <div class="space-y-1.5">
                                <label class="text-[11px] font-medium text-gray-500">Mood</label>
                                <select id="selMood" class="w-full bg-gray-950 border border-gray-800 text-gray-300 text-sm rounded-lg p-2.5 outline-none focus:ring-1 focus:ring-violet-500">
                                    <option value="Ceria & Menyenangkan">Ceria & Menyenangkan</option>
                                    <option value="Edukatif & Belajar">Edukatif & Belajar</option>
                                    <option value="Petualangan Ajaib">Petualangan Ajaib</option>
                                    <option value="Lucu & Komedi">Lucu & Komedi</option>
                                    <option value="Tenang/Lullaby">Tenang/Lullaby</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div id="error-message" class="hidden mt-4 p-4 bg-red-950/80 text-red-200 text-sm rounded-xl border border-red-800 shadow-lg break-words whitespace-pre-wrap font-mono text-xs"></div>

                    <button id="btnGenerate" onclick="generatePrompt()" class="w-full mt-8 bg-violet-600 hover:bg-violet-500 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-violet-900/20 transition-all active:scale-[0.98] flex items-center justify-center">
                        <svg class="w-5 h-5 mr-2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
                        <span id="btnText">Generate Prompts</span>
                    </button>
                </div>
            </div>

            <!-- Right Column: Result Panel -->
            <div class="lg:col-span-8">
                <div class="bg-gray-950 rounded-3xl border border-gray-800 h-full min-h-[500px] flex flex-col relative overflow-hidden shadow-2xl">
                    
                    <!-- Result Header -->
                    <div class="flex items-center justify-between p-4 border-b border-gray-800 bg-gray-900">
                        <h2 class="font-bold text-gray-200 flex items-center text-sm uppercase tracking-wider">
                            <div class="w-2 h-2 rounded-full bg-green-500 mr-3 animate-pulse"></div>
                            Output Prompts (English)
                        </h2>
                        <button id="btnCopyAll" onclick="copyAllPrompts()" class="hidden inline-flex items-center px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-gray-800 border border-gray-700 text-gray-300 hover:bg-gray-700 hover:text-white">
                            <svg id="copyIconAll" class="w-4 h-4 mr-1.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                            <span id="copyTextAll">Copy All Shots</span>
                        </button>
                    </div>

                    <!-- Result Content -->
                    <div class="p-6 flex-1 overflow-y-auto bg-[#0a0a0a]" id="result-container">
                        <!-- Default Empty State -->
                        <div id="state-empty" class="h-full flex flex-col items-center justify-center text-center text-gray-500">
                            <div class="bg-gray-900 border border-gray-800 w-20 h-20 rounded-2xl flex items-center justify-center mb-4">
                                <svg class="w-8 h-8 text-gray-600" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
                            </div>
                            <p class="font-mono text-sm">Waiting for input...</p>
                            <p class="text-xs mt-2 text-gray-600">Generated prompts will be split into multiple shots.</p>
                        </div>

                        <!-- Loading State -->
                        <div id="state-loading" class="hidden h-full flex flex-col items-center justify-center text-gray-500 space-y-4">
                            <div class="relative">
                                <div class="w-16 h-16 border-4 border-gray-800 border-t-violet-500 rounded-full animate-spin"></div>
                            </div>
                            <p class="font-mono text-sm animate-pulse">Generating sequential prompts in English...</p>
                        </div>

                        <!-- Content State -->
                        <div id="state-content" class="hidden max-w-4xl mx-auto"></div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
let currentTab="text",base64Image=null,mimeTypeImage=null,finalResultText="";
const $=id=>document.getElementById(id);
function switchTab(t){currentTab=t;$("input-text-container").classList.toggle("hidden",t!=="text");$("input-image-container").classList.toggle("hidden",t!=="image");$("tab-text").classList.toggle("bg-gray-800",t==="text");$("tab-image").classList.toggle("bg-gray-800",t==="image");}
function handleImageChange(e){const f=e.target.files[0];if(!f)return;if(!f.type.startsWith("image/"))return showError("File gambar tidak valid.");mimeTypeImage=f.type;$("imagePreview").src=URL.createObjectURL(f);$("image-preview-container").classList.remove("hidden");$("image-placeholder").classList.add("hidden");const r=new FileReader();r.onloadend=()=>base64Image=r.result.split(",")[1];r.readAsDataURL(f);}
function clearImage(e){e.preventDefault();e.stopPropagation();$("fileInput").value="";base64Image=null;mimeTypeImage=null;$("image-preview-container").classList.add("hidden");$("image-placeholder").classList.remove("hidden");}
function showError(m){$("error-message").textContent="⚠️ ERROR: "+m;$("error-message").classList.remove("hidden")}function hideError(){$("error-message").classList.add("hidden")}
async function generatePrompt(){
hideError();const idea=$("textInput").value.trim(),duration=$("selDuration").value,style=$("selStyle").value,mood=$("selMood").value;
if(currentTab==="text"&&!idea)return showError("Isi Concept / Story Idea dulu.");
if(currentTab==="image"&&!base64Image)return showError("Upload gambar reference dulu.");
$("btnGenerate").disabled=true;$("btnText").textContent="Generating...";$("state-empty").classList.add("hidden");$("state-loading").classList.remove("hidden");
const prompt=`Create cinematic YouTube Shorts prompts in English. Idea: ${idea||"Use uploaded reference image."} Duration: ${duration}. Art style: ${style}. Mood: ${mood}. Keep character and visual continuity. Vertical 9:16. Return only SHOT 1, SHOT 2 etc with "Prompt:".`;
try{const r=await fetch("/.netlify/functions/gemini",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt,image:base64Image?{data:base64Image,mimeType:mimeTypeImage}:null})});const raw=await r.text();let d={};try{d=JSON.parse(raw)}catch{}if(!r.ok)throw Error(d.error||"HTTP "+r.status);if(!d.text)throw Error("Gemini mengembalikan jawaban kosong.");finalResultText=d.text;$("state-loading").classList.add("hidden");$("state-content").classList.remove("hidden");$("state-content").innerHTML='<div class="bg-gray-900 border border-gray-800 rounded-2xl p-5"><pre class="whitespace-pre-wrap break-words text-sm leading-7 text-gray-200 font-sans">'+escapeHtml(d.text)+"</pre></div>";$("btnCopyAll").classList.remove("hidden")}catch(e){$("state-loading").classList.add("hidden");$("state-empty").classList.remove("hidden");showError(e.message)}finally{$("btnGenerate").disabled=false;$("btnText").textContent="Generate Prompts"}}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
async function copyAllPrompts(){if(finalResultText)await navigator.clipboard.writeText(finalResultText)}
</script></body></html>
